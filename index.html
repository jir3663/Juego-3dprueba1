<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lust Multiverse - Creación de Personaje</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0c0814;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* Interfaz UI Superior y Lateral */
        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header-box {
            background: rgba(15, 12, 25, 0.85);
            padding: 15px 20px;
            border-radius: 12px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 0, 85, 0.3);
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ff0055;
            font-size: 1.3rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            margin: 0;
            font-size: 0.8rem;
            color: #aaa;
        }

        .footer-controls {
            background: rgba(15, 12, 25, 0.9);
            padding: 15px;
            border-radius: 15px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 85, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .btn-action {
            background: linear-gradient(135deg, #ff0055, #990033);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,85,0.5);
            transition: transform 0.2s;
        }
        .btn-action:active { transform: scale(0.95); }

        .hint-rotate {
            font-size: 0.75rem;
            color: #ffb6c1;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- CONTENEDOR 3D -->
    <div id="canvas-container"></div>

    <!-- INTERFAZ DE USUARIO -->
    <div class="ui-overlay">
        <div class="header-box">
            <h1>Estudio de Creación</h1>
            <p>Personaje: Marge Simpson (Estilo Estilizado & Sensual)</p>
        </div>

        <div class="footer-controls">
            <div class="hint-rotate">🔄 Arrastra para girar 360°<br>🔍 Pellizca para zoom</div>
            <button class="btn-action" onclick="alert('¡Paso 1 completado! Continuaremos con las historias en el siguiente paso.')">Siguiente Paso</button>
        </div>
    </div>

    <!-- Three.js y OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
