<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lust Multiverse - Marge Simpson Real</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0c0814;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header-box {
            background: rgba(15, 12, 25, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 0, 85, 0.3);
            text-align: center;
            max-width: 380px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ff0055;
            font-size: 1.15rem;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }

        p {
            margin: 0;
            font-size: 0.75rem;
            color: #aaa;
        }

        .footer-controls {
            background: rgba(15, 12, 25, 0.9);
            padding: 12px 20px;
            border-radius: 15px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 85, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .btn-action {
            background: linear-gradient(135deg, #ff0055, #990033);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,85,0.5);
        }

        .hint-rotate {
            font-size: 0.75rem;
            color: #ffb6c1;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="header-box">
            <h1>Marge Simpson (Arte Real)</h1>
            <p>Visualización 360° Interactiva</p>
        </div>

        <div class="footer-controls">
            <div class="hint-rotate">🔄 Arrastra para girar 360°</div>
            <button class="btn-action" onclick="alert('¡Personaje real cargado correctamente!')">Siguiente Paso</button>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, margeMesh;
        let clock = new THREE.Clock();
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0814);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Iluminación ambiental limpia para que el arte se vea con sus colores originales vivos
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            // Cargar la textura real con soporte de seguridad CORS habilitado
            const textureLoader = new THREE.TextureLoader();
            textureLoader.crossOrigin = 'anonymous'; // <-- Vital para GitHub Pages

            textureLoader.load(
                'https://upload.wikimedia.org/wikipedia/en/5/52/Marge_Simpson.png',
                function(texture) {
                    const geometry = new THREE.PlaneGeometry(2.4, 3.8);
                    const material = new THREE.MeshBasicMaterial({ 
                        map: texture, 
                        transparent: true,
                        side: THREE.DoubleSide 
                    });
                    
                    margeMesh = new THREE.Mesh(geometry, material);
                    margeMesh.position.y = -0.1;
                    scene.add(margeMesh);
                },
                undefined,
                function(err) {
                    console.error("Error al cargar la imagen:", err);
                }
            );

            // Controles táctiles y de ratón para rotación 360 grados
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                if (margeMesh) {
                    margeMesh.rotation.y += deltaX * 0.01;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointerup', () => { isDragging = false; });
            dom.addEventListener('pointerleave', () => { isDragging = false; });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (margeMesh) {
                // Sutil movimiento orgánico de respiración (flotación vertical)
                margeMesh.position.y = -0.1 + Math.sin(elapsedTime * 2) * 0.03;
                
                // Si el usuario no está arrastrando, un leve giro automático de presentación
                if (!isDragging) {
                    margeMesh.rotation.y = Math.sin(elapsedTime * 0.8) * 0.18;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
