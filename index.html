<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lust Multiverse - Personaje 3D</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0c0814;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header-box {
            background: rgba(15, 12, 25, 0.85);
            padding: 12px 20px;
            border-radius: 12px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 0, 85, 0.3);
            text-align: center;
            max-width: 350px;
            margin: 0 auto;
        }

        h1 {
            color: #ff0055;
            font-size: 1.15rem;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }

        p {
            margin: 0;
            font-size: 0.75rem;
            color: #aaa;
        }

        .footer-controls {
            background: rgba(15, 12, 25, 0.9);
            padding: 12px 20px;
            border-radius: 15px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 85, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .btn-action {
            background: linear-gradient(135deg, #ff0055, #990033);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,85,0.5);
        }

        .hint-rotate {
            font-size: 0.75rem;
            color: #ffb6c1;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="header-box">
            <h1>Marge Simpson 3D</h1>
            <p>Modelo 360° con curvas estilizadas</p>
        </div>

        <div class="footer-controls">
            <div class="hint-rotate">🔄 Arrastra para girar 360°</div>
            <button class="btn-action" onclick="alert('¡Personaje 3D verificado correctamente!')">Siguiente</button>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, margeGroup;
        let clock = new THREE.Clock();
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0814);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.0, 5.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Iluminación profesional para resaltar volúmenes (pecho y glúteos)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const frontLight = new THREE.DirectionalLight(0xffffff, 1.2);
            frontLight.position.set(0, 2, 4);
            scene.add(frontLight);

            const pinkLight = new THREE.PointLight(0xff0055, 2.5, 10);
            pinkLight.position.set(2, 1, 2);
            scene.add(pinkLight);

            const blueLight = new THREE.PointLight(0x00d2ff, 1.5, 10);
            blueLight.position.set(-2, 1, -2);
            scene.add(blueLight);

            // Construir el personaje 3D detallado
            buildMarge3DModel();

            // Controles táctiles y de ratón 360°
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                if (margeGroup) {
                    margeGroup.rotation.y += deltaX * 0.01;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointerup', () => { isDragging = false; });
            dom.addEventListener('pointerleave', () => { isDragging = false; });

            animate();
        }

        function buildMarge3DModel() {
            margeGroup = new THREE.Group();

            // Materiales con colores oficiales y brillo elegante
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd90f, roughness: 0.3 }); // Amarillo Simpson
            const dressMat = new THREE.MeshStandardMaterial({ color: 0x28a745, roughness: 0.25, metalness: 0.1 }); // Vestido verde
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x0085c3, roughness: 0.3 }); // Pelo azul

            // 1. Vestido / Torso con silueta reloj de arena (Cintura marcada)
            const torsoGeo = new THREE.CylinderGeometry(0.22, 0.34, 1.1, 32);
            const torso = new THREE.Mesh(torsoGeo, dressMat);
            torso.position.y = 0.3;

            // 2. Pecho (Realce frontal sensual y voluminoso)
            const chestGeo = new THREE.SphereGeometry(0.25, 32, 16);
            chestGeo.scale(1.2, 0.9, 1.3);
            const chest = new THREE.Mesh(chestGeo, dressMat);
            chest.position.set(0, 0.62, 0.12);

            // 3. Glúteos (Volumen trasero pronunciado y elegante)
            const glutesGeo = new THREE.SphereGeometry(0.28, 32, 16);
            glutesGeo.scale(1.3, 1.1, 1.4);
            const glutes = new THREE.Mesh(glutesGeo, dressMat);
            glutes.position.set(0, -0.05, -0.15);

            // 4. Cuello y Cabeza Amarilla
            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.3, 16), skinMat);
            neck.position.y = 0.95;

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), skinMat);
            head.position.y = 1.35;

            // Ojos icónicos saltones
            const eyeGeo = new THREE.SphereGeometry(0.1, 16, 16);
            const pupilGeo = new THREE.SphereGeometry(0.04, 16, 16);
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

            const eyeL = new THREE.Mesh(eyeGeo, whiteMat);
            eyeL.position.set(0.12, 1.4, 0.28);
            const pupilL = new THREE.Mesh(pupilGeo, blackMat);
            pupilL.position.set(0.14, 1.4, 0.36);

            const eyeR = new THREE.Mesh(eyeGeo, whiteMat);
            eyeR.position.set(-0.12, 1.4, 0.28);
            const pupilR = new THREE.Mesh(pupilGeo, blackMat);
            pupilR.position.set(-0.14, 1.4, 0.36);

            // 5. Icónico Pelo Alto Azul
            const hairGeo = new THREE.CylinderGeometry(0.3, 0.38, 1.6, 32);
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 2.35;

            // Ensamblar todo en el grupo principal
            margeGroup.add(torso, chest, glutes, neck, head, eyeL, pupilL, eyeR, pupilR, hair);
            margeGroup.position.y = -0.35;
            scene.add(margeGroup);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (margeGroup) {
                // Movimiento de respiración natural y sutil
                margeGroup.position.y = -0.35 + Math.sin(elapsedTime * 2) * 0.02;
                
                // Rotación automática suave de coqueteo si no se está arrastrando
                if (!isDragging) {
                    margeGroup.rotation.y = Math.sin(elapsedTime * 0.8) * 0.2;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = init;
    </script>
</body>
</html>
