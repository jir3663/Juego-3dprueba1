<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lust Multiverse Mobile</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: Arial, sans-serif;
            user-select: none;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* HUD DE JUEGO */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 15, 25, 0.95);
            padding: 8px 12px;
            border-radius: 10px;
            pointer-events: auto;
            border: 1px solid rgba(255, 0, 85, 0.4);
        }

        .meter-box {
            width: 120px;
            background: #222;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #444;
        }
        #passion-fill {
            width: 15%; height: 100%;
            background: linear-gradient(90deg, #ff0055, #ffcc00);
            transition: width 0.3s ease;
        }

        /* PANEL LATERAL DE JUGUETES */
        .side-toys {
            position: absolute;
            top: 75px; left: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: auto;
        }
        .toy-pill {
            background: #1f122e;
            border: 1px solid #ff0055;
            color: #ffb6c1;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
        .toy-pill:active { background: #ff0055; color: #fff; }

        /* CAJA DE DIÁLOGO INFERIOR */
        .dialog-panel {
            background: rgba(10, 10, 18, 0.95);
            border: 2px solid #ff0055;
            border-radius: 12px;
            padding: 15px;
            pointer-events: auto;
            margin-bottom: 5px;
            box-shadow: 0 5px 25px rgba(255,0,85,0.4);
        }

        #speaker-title {
            font-size: 0.95rem;
            color: #ff3399;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        #dialog-content {
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 12px;
            min-height: 40px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .option-btn {
            background: #1c1c36;
            color: white;
            border: 1px solid #ff0055;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: left;
        }
        .option-btn:active { background: #ff0055; }

        /* MENÚ INICIAL */
        #main-menu {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #06060c;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
        }

        .menu-container {
            max-width: 600px;
            width: 100%;
        }

        .section-box {
            margin-bottom: 15px;
        }

        .section-label {
            color: #ff0055;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 6px;
            border-bottom: 1px solid #222;
            padding-bottom: 3px;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .card-item {
            background: #111122;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px 5px;
            cursor: pointer;
            text-align: center;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .card-item.active {
            border-color: #ff0055;
            background: #2a122e;
        }

        .upload-card {
            background: #221028;
            border: 2px dashed #ff0055;
            color: #ff77aa;
        }
        #img-file { display: none; }

        .launch-btn {
            background: #ff0055;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(255,0,85,0.6);
        }
    </style>
</head>
<body>

    <!-- MENÚ PRINCIPAL -->
    <div id="main-menu">
        <h1 style="color: #ff0055; font-size: 1.5rem; margin: 10px 0 5px 0; text-align: center;">LUST MULTIVERSE</h1>
        <p style="color: #888; font-size: 0.8rem; text-align: center; margin-bottom: 15px;">Selecciona estilo y tropo para jugar</p>
        
        <div class="menu-container">
            <!-- Estilo Visual -->
            <div class="section-box">
                <div class="section-label">1. Estilo Visual</div>
                <div class="grid-cards">
                    <label class="card-item upload-card" for="img-file" id="lbl-photo">Subir Foto</label>
                    <input type="file" id="img-file" accept="image/*" onchange="handleImage(event)">
                    
                    <div class="card-item active" id="st-realista" onclick="setStyle('Realista', 0x334155, 'st-realista')">Realista</div>
                    <div class="card-item" id="st-manga" onclick="setStyle('Manga', 0xff0055, 'st-manga')">Manga</div>
                    <div class="card-item" id="st-simpson" onclick="setStyle('Simpson', 0xd97706, 'st-simpson')">Simpson</div>
                    <div class="card-item" id="st-looney" onclick="setStyle('Looney Tunes', 0x94a3b8, 'st-looney')">Looney Tunes</div>
                    <div class="card-item" id="st-family" onclick="setStyle('Padre de Familia', 0x16a34a, 'st-family')">Padre de Familia</div>
                    <div class="card-item" id="st-demon" onclick="setStyle('Demon Slayer', 0x0284c7, 'st-demon')">Demon Slayer</div>
                </div>
            </div>

            <!-- Tropo / Historia -->
            <div class="section-box">
                <div class="section-label">2. Historia / Tropo</div>
                <div class="grid-cards">
                    <div class="card-item active" id="tr-jefe" onclick="setTrope('Jefe y Empleada', 'Oficina nocturna', 'tr-jefe')">Jefe / Empleada</div>
                    <div class="card-item" id="tr-cunado" onclick="setTrope('Cuñado y Cuñada', 'Tarde a solas', 'tr-cunado')">Cuñado / Cuñada</div>
                    <div class="card-item" id="tr-madrastra" onclick="setTrope('Madrastra', 'Salón de casa', 'tr-madrastra')">Madrastra</div>
                    <div class="card-item" id="tr-vecina" onclick="setTrope('La Vecina', 'Visita inesperada', 'tr-vecina')">La Vecina</div>
                    <div class="card-item" id="tr-camarera" onclick="setTrope('Camarera', 'Cierre del bar', 'tr-camarera')">Camarera</div>
                    <div class="card-item" id="tr-masajista" onclick="setTrope('Masajista', 'Gabinete privado', 'tr-masajista')">Masajista</div>
                </div>
            </div>

            <button class="launch-btn" onclick="startGame()">COMENZAR JUEGO</button>
        </div>
    </div>

    <!-- ESCENARIO 3D -->
    <div id="canvas-container"></div>

    <!-- HUD DE JUEGO -->
    <div class="ui-layer" id="game-hud" style="display: none;">
        <div class="top-hud">
            <div>
                <div id="hud-style" style="font-weight: bold; color: #ff3399; font-size: 0.8rem;">Estilo</div>
                <div id="hud-trope" style="font-size: 0.7rem; color: #aaa;">Tropo</div>
            </div>
            <div>
                <div style="font-size: 0.65rem; color: #bbb; text-align: right; margin-bottom: 2px;">Pasión</div>
                <div class="meter-box"><div id="passion-fill"></div></div>
            </div>
        </div>

        <div class="side-toys">
            <div class="toy-pill" onclick="useToy('Vibrador')"> vibrador</div>
            <div class="toy-pill" onclick="useToy('Esposas')"> esposas</div>
            <div class="toy-pill" onclick="useToy('Aceite')"> aceite</div>
        </div>

        <div class="dialog-panel">
            <div id="speaker-title">Nombre</div>
            <div id="dialog-content">Texto...</div>
            <div class="options-list" id="options-box"></div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let currentStyle = 'Realista', currentColor = 0x334155;
        let currentTrope = 'Jefe y Empleada', currentDesc = 'Oficina nocturna';
        let customPhoto = null;
        let passion = 15;
        let currentNode = 'node1';
        let activeToy = '';
        let scene, camera, renderer, charGroup;

        function setStyle(style, color, id) {
            currentStyle = style;
            currentColor = color;
            customPhoto = null;
            document.querySelectorAll('.card-item').forEach(el => {
                if(!el.classList.contains('upload-card')) el.classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
            document.getElementById('lbl-photo').classList.remove('active');
        }

        function setTrope(trope, desc, id) {
            currentTrope = trope;
            currentDesc = desc;
            document.querySelectorAll('.card-item').forEach(el => {
                if(el.id.startsWith('tr-')) el.classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
        }

        function handleImage(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    customPhoto = evt.target.result;
                    currentStyle = 'Personalizado';
                    currentColor = 0x666666;
                    document.querySelectorAll('.card-item').forEach(el => el.classList.remove('active'));
                    document.getElementById('lbl-photo').classList.add('active');
                }
                reader.readAsDataURL(file);
            }
        }

        // ÁRBOL DE HISTORIAS
        const story = {
            node1: {
                text: () => `Estás en la situación de (${currentTrope}): ${currentDesc}. Se acerca lentamente con una sonrisa cómplice. ¿Qué haces?`,
                choices: [
                    { text: "Acercarme y acariciar su rostro.", next: "node2", add: 20 },
                    { text: "Decirle algo sugerente al oído.", next: "node3", add: 35 },
                    { text: "Tomarle de la cintura con firmeza.", next: "node4", add: 50 }
                ]
            },
            node2: {
                text: "Cierra los ojos disfrutando del tacto, arqueando ligeramente el cuerpo hacia ti con respiración agitada.",
                choices: [
                    { text: "Deslizar mis manos hacia su espalda.", next: "climax", add: 30 },
                    { text: "Dar un beso lento en su cuello.", next: "climax", add: 45 }
                ]
            },
            node3: {
                text: "Se le escapa una risa nerviosa seguida de un suspiro profundo. Su mirada se vuelve mucho más intensa.",
                choices: [
                    { text: "Morder suavemente su lóbulo.", next: "climax", add: 40 },
                    { text: "Empujar con suavidad contra la pared.", next: "climax", add: 55 }
                ]
            },
            node4: {
                text: "Un escalofrío recorre su cuerpo ante el agarre repentino. Te sostiene de los hombros con fuerza.",
                choices: [
                    { text: "Unir vuestros labios en un beso apasionado.", next: "climax", add: 50 }
                ]
            },
            climax: {
                text: () => `🔥 [ESCENA ÍNTIMA ACTIVA] Tropo: ${currentTrope} | Estilo: ${currentStyle}. ${activeToy ? 'Juguete: ' + activeToy + '.' : ''} La pasión ha llegado al límite.`,
                choices: [
                    { text: "🔄 Reiniciar experiencia", next: "node1", add: -100 }
                ]
            }
        };

        function useToy(toy) {
            activeToy = toy;
            passion = Math.min(100, passion + 25);
            updateHUD();
            renderNode();
            if(charGroup) {
                charGroup.scale.set(1.2, 0.8, 1.2);
                setTimeout(() => charGroup.scale.set(1,1,1), 200);
            }
        }

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-hud').style.display = 'flex';
            document.getElementById('hud-style').innerText = `Estilo: ${currentStyle}`;
            document.getElementById('hud-trope').innerText = `Tropo: ${currentTrope}`;
            
            passion = 15;
            currentNode = 'node1';
            activeToy = '';
            
            renderNode();

            try {
                init3D();
            } catch(err) {
                console.warn("Error 3D:", err);
            }
        }

        function renderNode() {
            const data = story[currentNode];
            if(!data) return;

            document.getElementById('speaker-title').innerText = currentTrope;
            document.getElementById('dialog-content').innerText = typeof data.text === 'function' ? data.text() : data.text;

            const box = document.getElementById('options-box');
            box.innerHTML = '';

            data.choices.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = ch.text;
                btn.onclick = () => {
                    if(ch.add === -100) passion = 15;
                    else passion = Math.min(100, passion + ch.add);
                    currentNode = ch.next;
                    updateHUD();
                    renderNode();
                };
                box.appendChild(btn);
            });
        }

        function updateHUD() {
            document.getElementById('passion-fill').style.width = `${passion}%`;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a050f);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 5.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const amb = new THREE.AmbientLight(0xffb6c1, 0.8);
            scene.add(amb);

            const point = new THREE.PointLight(0xff0055, 2, 10);
            point.position.set(2, 3, 2);
            scene.add(point);

            charGroup = new THREE.Group();
            
            let skinMat;
            if(customPhoto && currentStyle === 'Personalizado') {
                const tex = new THREE.TextureLoader().load(customPhoto);
                skinMat = new THREE.MeshStandardMaterial({ map: tex });
            } else {
                skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.5 });
            }

            const outfitMat = new THREE.MeshStandardMaterial({ color: currentColor, roughness: 0.3 });

            // CONSTRUCTOR DE MODELOS 3D ESTILIZADOS
            if (currentStyle === 'Realista' || currentStyle === 'Personalizado') {
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.25, 1.2), outfitMat);
                body.position.y = 0.6;
                const head = new THREE.Mesh(currentStyle === 'Personalizado' ? new THREE.BoxGeometry(0.55, 0.65, 0.5) : new THREE.SphereGeometry(0.32, 16, 16), skinMat);
                head.position.y = 1.45;
                charGroup.add(body, head);
            } 
            else if (currentStyle === 'Manga') {
                // Cuerpo cónico y pelo puntiagudo característico
                const body = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.2, 16), outfitMat);
                body.position.y = 0.6;
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), skinMat);
                head.position.y = 1.45;
                // Mechón de pelo anime superior
                const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const hair = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.5, 4), hairMat);
                hair.position.set(0, 1.85, 0);
                hair.rotation.z = -0.2;
                charGroup.add(body, head, hair);
            } 
            else if (currentStyle === 'Simpson') {
                const yellowSkin = new THREE.MeshStandardMaterial({ color: 0xffd90f, roughness: 0.4 });
                const bluePants = new THREE.MeshStandardMaterial({ color: 0x0085c3 });
                const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.0), bluePants);
                body.position.y = 0.5;
                // Cabeza cilíndrica alargada típica
                const head = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.85, 16), yellowSkin);
                head.position.y = 1.35;
                charGroup.add(body, head);
            } 
            else if (currentStyle === 'Looney Tunes') {
                // Cuerpo esférico y orejas largas
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), outfitMat);
                body.position.y = 0.55;
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), outfitMat);
                head.position.y = 1.35;
                const earGeo = new THREE.CapsuleGeometry(0.1, 0.6, 4, 8);
                const ear1 = new THREE.Mesh(earGeo, outfitMat);
                ear1.position.set(-0.2, 1.9, 0);
                ear1.rotation.z = -0.2;
                const ear2 = ear1.clone();
                ear2.position.x = 0.2;
                ear2.rotation.z = 0.2;
                charGroup.add(body, head, ear1, ear2);
            } 
            else if (currentStyle === 'Padre de Familia') {
                // Cuerpo robusto y barbilla prominente
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.1, 0.55), outfitMat);
                body.position.y = 0.55;
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.65, 0.65), skinMat);
                head.position.y = 1.35;
                charGroup.add(body, head);
            } 
            else if (currentStyle === 'Demon Slayer') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.45),
