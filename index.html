<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lust Multiverse - Selección de Personaje</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #05050b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            color: #fff;
        }

        /* Contenedor General */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at center, #1a0b1c 0%, #05050b 100%);
        }

        /* PANTALLA 1: SELECTOR DE FRANQUICIAS / PERSONAJES */
        #selector-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(5, 5, 11, 0.95);
            backdrop-filter: blur(10px);
        }

        .selector-box {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #ff0055;
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(255,0,85,0.5);
        }

        .subtitle {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .franchise-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .franchise-card {
            background: linear-gradient(135deg, #161226, #2a1538);
            border: 2px solid #ff0055;
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 6px 20px rgba(255,0,85,0.25);
            transition: all 0.25s ease;
        }
        .franchise-card:active {
            transform: scale(0.97);
            background: #ff0055;
        }

        /* PANTALLA 2: VISUALIZADOR DEL PERSONAJE SELECCIONADO */
        #viewer-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 15, 30, 0.85);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,0,85,0.3);
            backdrop-filter: blur(6px);
        }

        .char-title {
            color: #ff3399;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .back-btn {
            background: transparent;
            border: 1px solid #aaa;
            color: #aaa;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Escenario de Visualización de la Fotografía Sensual */
        .stage-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 10px 0;
        }

        .character-photo-frame {
            width: 260px;
            height: 380px;
            border-radius: 20px;
            border: 3px solid #ff0055;
            box-shadow: 0 10px 40px rgba(255, 0, 85, 0.4);
            overflow: hidden;
            position: relative;
            background: #111;
        }

        .character-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.05) saturate(1.1);
        }

        .bottom-action-panel {
            background: rgba(20, 15, 30, 0.9);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,0,85,0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .next-stage-btn {
            background: linear-gradient(135deg, #ff0055, #990033);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,85,0.6);
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- PANTALLA 1: SELECTOR DE PERSONAJE -->
        <div id="selector-screen">
            <div class="selector-box">
                <h1>Lust Multiverse</h1>
                <div class="subtitle">Selecciona una franquicia para comenzar</div>

                <div class="franchise-grid">
                    <div class="franchise-card" onclick="selectFranchise('Los Simpsons')">
                        🟡 Los Simpsons (Marge)
                    </div>
                    <div class="franchise-card" style="opacity: 0.5;" onclick="alert('Próximamente disponible en siguientes actualizaciones')">
                        🟣 Otra Franquicia (Bloqueado)
                    </div>
                </div>
            </div>
        </div>

        <!-- PANTALLA 2: VISUALIZACIÓN DE MARGE SIMPSON SENSUAL -->
        <div id="viewer-screen">
            <div class="top-hud">
                <div class="char-title">Marge Simpson</div>
                <button class="back-btn" onclick="goBackToSelector()">⬅ Volver</button>
            </div>

            <div class="stage-center">
                <div class="character-photo-frame">
                    <!-- Fotografía optimizada con estética coqueta, elegante y volúmenes resaltados -->
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Marge Simpson Sensual" id="char-img">
                </div>
            </div>

            <div class="bottom-action-panel">
                <div style="font-size: 0.75rem; color: #ffb6c1; text-align: center;">✨ Edición Exclusiva (+18) • Silueta Estilizada</div>
                <button class="next-stage-btn" onclick="alert('¡Personaje seleccionado con éxito! En el próximo paso añadiremos los escenarios y la novela interactiva.')">Siguiente Paso (Historias)</button>
            </div>
        </div>
    </div>

    <script>
        function selectFranchise(name) {
            if (name === 'Los Simpsons') {
                // Ocultar selector y mostrar pantalla de visualización de Marge
                document.getElementById('selector-screen').style.display = 'none';
                document.getElementById('viewer-screen').style.display = 'flex';
            }
        }

        function goBackToSelector() {
            document.getElementById('viewer-screen').style.display = 'none';
            document.getElementById('selector-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
