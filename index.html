<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lust Multiverse - Creación de Personaje</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #0c0814;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            color: #fff;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .header-box {
            background: rgba(15, 12, 25, 0.85);
            padding: 15px 20px;
            border-radius: 12px;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 0, 85, 0.3);
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ff0055;
            font-size: 1.3rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        p {
            margin: 0;
            font-size: 0.8rem;
            color: #aaa;
        }

        .footer-controls {
            background: rgba(15, 12, 25, 0.9);
            padding: 15px;
            border-radius: 15px;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 85, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .btn-action {
            background: linear-gradient(135deg, #ff0055, #990033);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,0,85,0.5);
        }

        .hint-rotate {
            font-size: 0.75rem;
            color: #ffb6c1;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div class="header-box">
            <h1>Estudio de Creación</h1>
            <p>Personaje: Marge Simpson (Estilo Sensual & Estilizado)</p>
        </div>

        <div class="footer-controls">
            <div class="hint-rotate">🔄 Arrastra la pantalla para girar<br>✨ Visualización 360° Activa</div>
            <button class="btn-action" onclick="alert('¡Personaje cargado con éxito! Listos para el siguiente paso.')">Siguiente Paso</button>
        </div>
    </div>

    <!-- Three.js CDN Único y Estable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, margeGroup;
        let clock = new THREE.Clock();
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        function init() {
            const container = document.getElementById('canvas-container');

            // Escena y Cámara
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0c0814);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 5.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Iluminación escénica
            const ambientLight = new THREE.AmbientLight(0xffb6c1, 0.8);
            scene.add(ambientLight);

            const keyLight = new THREE.PointLight(0xff0055, 2.5, 10);
            keyLight.position.set(2, 2, 3);
            scene.add(keyLight);

            const rimLight = new THREE.PointLight(0x00d2ff, 1.5, 10);
            rimLight.position.set(-2, 2, -2);
            scene.add(rimLight);

            // Construir Personaje
            buildMargeModel();

            // Eventos táctiles y de ratón para rotación 360 grados fluida
            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                if (margeGroup) {
                    margeGroup.rotation.y += deltaX * 0.01;
                }
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            dom.addEventListener('pointerup', () => { isDragging = false; });
            dom.addEventListener('pointerleave', () => { isDragging = false; });

            animate();
        }

        function buildMargeModel() {
            margeGroup = new THREE.Group();

            const skinMat = new THREE.MeshStandardMaterial({ color: 0xffd90f, roughness: 0.3 });
            const dressMat = new THREE.MeshStandardMaterial({ color: 0x28a745, roughness: 0.4 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x0085c3, roughness: 0.3 });

            // Torso con curvas estilizadas
            const torsoGeo = new THREE.CylinderGeometry(0.28, 0.32, 1.1, 32);
            const torso = new THREE.Mesh(torsoGeo, dressMat);
            torso.position.y = 0.3;

            // Pecho prominente y sensual
            const chestGeo = new THREE.SphereGeometry(0.26, 32, 16);
            chestGeo.scale(1.1, 0.9, 1.2);
            const chest = new THREE.Mesh(chestGeo, dressMat);
            chest.position.set(0, 0.65, 0.12);

            // Glúteos pronunciados
            const glutesGeo = new THREE.SphereGeometry(0.3, 32, 16);
            glutesGeo.scale(1.2, 1.0, 1.3);
            const glutes = new THREE.Mesh(glutesGeo, dressMat);
            glutes.position.set(0, -0.05, -0.15);

            // Cuello y Cabeza
            const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.3, 16), skinMat);
            neck.position.y = 0.95;

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 32), skinMat);
            head.position.y = 1.3;

            // Pelo azul icónico alargado
            const hairGeo = new THREE.CylinderGeometry(0.32, 0.38, 1.6, 32);
            const hair = new THREE.Mesh(hairGeo, hairMat);
            hair.position.y = 2.3;

            margeGroup.add(torso, chest, glutes, neck, head, hair);
            margeGroup.position.y = -0.4;
            scene.add(margeGroup);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (margeGroup) {
                // Respiración natural sutil en el eje Y
                margeGroup.position.y = -0.4 + Math.sin(elapsedTime * 2) * 0.02;
                
                // Si el usuario no está arrastrando, añadir un leve giro automático de coqueteo
                if (!isDragging) {
                    margeGroup.rotation.y += 0.003;
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Inicializar al cargar la ventana
        window.onload = init;
    </script>
</body>
</html>
